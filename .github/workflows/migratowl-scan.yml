# Migratowl scans this repository's outdated dependencies with the published GitHub Action.
#
# The model is a free OpenRouter model through the OpenAI-compatible API, so a scan costs nothing.
# Requires the OPENROUTER_API_KEY repository secret.

name: Migratowl Dependency Scan

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  migratowl-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: bitkaio/migratowl-action@v1
        with:
          model-provider: openai
          llm-base-url: https://openrouter.ai/api/v1
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: nvidia/nemotron-3-super-120b-a12b:free
          scan-trigger: always
          max-deps: 3
          initial-wait: 120
